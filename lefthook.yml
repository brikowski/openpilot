pre-commit:
  parallel: true
  jobs:
    - name: staged whitespace
      run: git diff --cached --check
    - name: tuning tooling lint
      run: .venv/bin/ruff check .agents --ignore ISC002
    - name: tuning tooling tests
      run: .venv/bin/python -m pytest .agents/test_validate_log.py .agents/test_inspect_response.py .agents/test_compare_uphill_response.py .agents/test_compare_lateral_response.py .agents/test_replay_carcontroller.py .agents/test_inspect_response_model.py .agents/test_inspect_pitch_grade.py -q
    - name: Honda tune lint
      run: .venv/bin/ruff check opendbc_repo/opendbc/car/honda
